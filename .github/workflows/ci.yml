name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # semver half of the image tag scheme only exists on v-tags
  pull_request:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp-server

jobs:
  unit:
    name: unit + typecheck (no DB)
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: unit + Postgres-gated integration
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: figma
          POSTGRES_PASSWORD: figma
          POSTGRES_DB: figma_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U figma -d figma_mcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://figma:figma@localhost:5432/figma_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  stdio-smoke:
    name: stdio smoke (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mcp-server/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/stdio-smoke.mjs

  doc-sequences:
    name: documented command sequences
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      # No `pnpm install` step: the runner materialises the tree under review into a temp copy and
      # installs THERE, and only for a page that declares `# precondition: built-checkout`. pnpm is
      # on PATH above for that copy's sake. Installing here would put node_modules in the checkout,
      # which the copy deliberately does not inherit.
      #
      # Both pages run the commands they document, so this job needs docker — present on
      # ubuntu-latest. `docker/README.md` builds the image twice (local profile, then full); the two
      # bring-ups publish the same host port, so the runner tears each stack down before the next
      # fence. Measured warm on darwin: 25.7s for the whole page, of which 22s is the two bring-ups.
      # A cold runner pays a full image build on the first one.
      #
      # NO PAGE ARGUMENTS, deliberately. With no argument the runner drives every page in its own
      # DRIVEN table, so the list of pages CI covers has exactly one home. Naming them here instead
      # meant that deleting one `- run:` line silently dropped four of the five executed fences while
      # the job stayed green — this gate's own failure mode, inside the job that runs it.
      # tests/unit/doc-sequences-ci.test.ts asserts this step exists and still passes no page.
      - run: node scripts/run-doc-sequences.mjs

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 8.25 introduced [[allowlists]]; the version must stay in step with .gitleaks.toml
      # and with whatever the maintainer runs locally, or the config is read and its
      # entries silently ignored (that cost a red CI once already).
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan below walks every commit reachable from HEAD. A shallow clone reduces
          # that to ONE commit and still prints "no leaks found" - measured, and the reason
          # the count assertion exists.
          fetch-depth: 0

      - name: install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # gitleaks-action was here and is deliberately gone. On a pull_request it derived its
      # own commit range from the GitHub API and never paginated, so it scanned the FIRST 30
      # commits of the branch and stopped: PR #3 carried 40, the action reported "30 commits
      # scanned", and the ten it dropped were the NEWEST - exactly where a hastily added
      # token lands. It reported that number in a green job, so nothing about the run looked
      # wrong. There is no input that widens the range, so the range is gone instead: at
      # ~1.3s for this history there is nothing to gain by scanning less than all of it.
      #
      # --diff-merges=first-parent is load-bearing, not tidiness. gitleaks skips merge
      # commits by default, so a secret introduced while RESOLVING A CONFLICT lives only in
      # the merge and is invisible: measured on a purpose-built repo with a positive control
      # - the same token is found in a plain commit and reported "no leaks found" when it
      # sits in the merge alone. `-m` also finds it but reports once per parent.
      #
      # Passing --log-opts REPLACES the default walk (all refs, no merges), which is why the
      # expected count below is derived per-event rather than written down.
      - name: scan every commit, and prove the scan saw every commit
        run: |
          set -euo pipefail

          # This runs BEFORE the count check and is not redundant with it. The count check
          # derives `expected` from the same clone gitleaks walks, so on a shallow checkout
          # both sides collapse together and it reports a satisfied "1 of 1" - measured, and
          # it is the same shape of vacuous agreement this whole job exists to refuse. Only
          # a fact the truncation cannot restate catches truncation.
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::the checkout is shallow, so most of the history is not present to be scanned. The count check below cannot see this - it would compare a truncated scan against a truncated range and agree. Restore fetch-depth: 0."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            # The weekly sweep is the only run that reaches branches nobody opened a PR for -
            # public repo, public branches. A PR run must NOT use --all: the expected count
            # would then depend on how many stale branches the remote carries, and the gate
            # would go red for branch hygiene instead of for a secret.
            opts='--all --diff-merges=first-parent'
            expected=$(git rev-list --count --all)
          else
            opts='--diff-merges=first-parent'
            expected=$(git rev-list --count HEAD)
          fi

          gitleaks detect --redact --exit-code=2 --log-level=info --log-opts="$opts" 2>&1 | tee scan.log

          scanned=$(sed -E 's/\x1b\[[0-9;]*m//g' scan.log \
            | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | tail -1 || true)

          if [ -z "${scanned}" ]; then
            echo "::error::gitleaks printed no commit count. A scan that will not say what it covered proves nothing, and this job is green only when it says so."
            exit 1
          fi
          if [ "${scanned}" -ne "${expected}" ]; then
            echo "::error::gitleaks scanned ${scanned} commits; the range holds ${expected}. The difference is unscanned history, and a green scan over part of a range is worse than no scan - it carries a signature. Check fetch-depth and --log-opts."
            exit 1
          fi
          echo "gitleaks scanned ${scanned} of ${expected} commits."

  publish-image:
    name: publish image to GHCR
    # Gate: only a green test run publishes. `needs` on the five jobs above means a
    # red test — or a red gitleaks scan, or documentation whose own commands no longer
    # run — blocks the push. On `schedule` the four test jobs skip, the skip propagates
    # here, and no cron publication happens.
    # NEVER add always()/!cancelled() to this if: — that would defeat the gate.
    needs: [unit, integration, stdio-smoke, secrets-scan, doc-sequences]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    # The workflow-level default is `mcp-server` (the four jobs above need it); this
    # job's run-steps and build context live at the repo root, so override locally.
    # Do NOT change the workflow-level default.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHA cache export requires the docker-container buildx driver; the default `docker`
      # driver fails with "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zylomeara/framefit
          # latest=false: `latest` is emitted ONLY by the explicit type=raw rule below,
          # never by the action's default heuristic (same rule as the portal workflow).
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
