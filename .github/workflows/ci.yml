# Every third-party action is pinned to a full commit SHA, with the version it was at in a
# comment beside it. A tag is a movable reference: whoever owns the action's repository can
# repoint v4 at a different commit, and a runner then executes new code without a diff here
# and without a word in the log. This repository already knows that shape from its own GHCR
# sha- tags, which move when a commit is published twice - a tag is stable by convention, not
# by construction.
#
# The pin is load-bearing rather than tidy: publish-image holds `packages: write` on pushes to
# main, so an action swapped underneath us would hold a token that can write to the registry.
#
# To bump one, resolve the tag and read back which version that SHA actually is - do not copy a
# SHA from a release page, and do not trust the comment you are replacing:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#   git ls-remote --tags https://github.com/<owner>/<repo> | grep <sha>
#
# Settings -> Actions -> General -> "Require actions to be pinned to a full-length commit SHA"
# enforces this. Turning it on before the pins exist breaks every job, so the order is: this
# file first, the setting second.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # semver half of the image tag scheme only exists on v-tags
  pull_request:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: mcp-server

jobs:
  unit:
    name: unit + typecheck (no DB)
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: unit + Postgres-gated integration
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: figma
          POSTGRES_PASSWORD: figma
          POSTGRES_DB: figma_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U figma -d figma_mcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://figma:figma@localhost:5432/figma_mcp_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  stdio-smoke:
    name: stdio smoke (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          package_json_file: mcp-server/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/stdio-smoke.mjs

  doc-sequences:
    name: documented command sequences
    if: github.event_name != 'schedule'   # weekly cron runs only the secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml
      # No `pnpm install` step: the runner materialises the tree under review into a temp copy and
      # installs THERE, and only for a page that declares `# precondition: built-checkout`. pnpm is
      # on PATH above for that copy's sake. Installing here would put node_modules in the checkout,
      # which the copy deliberately does not inherit.
      #
      # Both pages run the commands they document, so this job needs docker — present on
      # ubuntu-latest. `docker/README.md` builds the image twice (local profile, then full); the two
      # bring-ups publish the same host port, so the runner tears each stack down before the next
      # fence. Measured warm on darwin: 25.7s for the whole page, of which 22s is the two bring-ups.
      # A cold runner pays a full image build on the first one.
      #
      # NO PAGE ARGUMENTS, deliberately. With no argument the runner drives every page in its own
      # DRIVEN table, so the list of pages CI covers has exactly one home. Naming them here instead
      # meant that deleting one `- run:` line silently dropped four of the five executed fences while
      # the job stayed green — this gate's own failure mode, inside the job that runs it.
      # tests/unit/doc-sequences-ci.test.ts asserts this step exists and still passes no page.
      - run: node scripts/run-doc-sequences.mjs

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The scan lives in scripts/secrets-scan.sh so CI and a maintainer's shell run the SAME
    # check by construction rather than by memo - a bare local gitleaks call once reported 12
    # leaks on a clean history because the binary predated the [[allowlists]] syntax and
    # silently ignored the config. Every gate (version assert, shallow-clone refusal,
    # commit-count assert, merge-commit walk) is in the script, with its rationale.
    #
    # The workflow-level default is `mcp-server`, and this job's steps belong at the repo
    # root, where .gitleaks.toml and the history live. Same override publish-image needs,
    # for the same reason.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The scan walks every commit reachable from HEAD. A shallow clone reduces that
          # to ONE commit and still prints "no leaks found" - measured, and the reason the
          # script refuses shallow checkouts outright.
          fetch-depth: 0

      - name: install the pinned gitleaks
        run: |
          # The version pin lives in scripts/secrets-scan.sh, which asserts it at run time;
          # grep it from there so a bump happens in exactly one place and CI cannot drift
          # from what the maintainer runs locally.
          v=$(grep -oE '^GITLEAKS_VERSION=[0-9.]+' scripts/secrets-scan.sh | cut -d= -f2)
          test -n "$v"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # gitleaks-action was here and is deliberately gone. On a pull_request it derived its
      # own commit range from the GitHub API and never paginated, so it scanned the FIRST 30
      # commits of the branch and stopped: PR #3 carried 40, the action reported "30 commits
      # scanned", and the ten it dropped were the NEWEST - exactly where a hastily added
      # token lands. The script scans the full range and proves the range was full.
      - name: scan every commit, and prove the scan saw every commit
        run: |
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            scripts/secrets-scan.sh all
          else
            scripts/secrets-scan.sh
          fi

  publish-image:
    name: publish image to GHCR
    # Gate: only a green test run publishes. `needs` on the five jobs above means a
    # red test — or a red gitleaks scan, or documentation whose own commands no longer
    # run — blocks the push. On `schedule` the four test jobs skip, the skip propagates
    # here, and no cron publication happens.
    # NEVER add always()/!cancelled() to this if: — that would defeat the gate.
    needs: [unit, integration, stdio-smoke, secrets-scan, doc-sequences]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    # The workflow-level default is `mcp-server` (the four jobs above need it); this
    # job's run-steps and build context live at the repo root, so override locally.
    # Do NOT change the workflow-level default.
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # GHA cache export requires the docker-container buildx driver; the default `docker`
      # driver fails with "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/zylomeara/framefit
          # latest=false: `latest` is emitted ONLY by the explicit type=raw rule below,
          # never by the action's default heuristic (same rule as the portal workflow).
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
